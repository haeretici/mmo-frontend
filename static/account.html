<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<title>Characters · Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="editor-header-bar">
    <a class="brand" title="Engine" href="/">
        <i class="fa-solid fa-dragon"></i> Engine
    </a>
    <nav class="menu-items">
        <a class="menu-item" href="/">Home</a>
        <a class="menu-item active" href="/account" aria-current="page">Characters</a>
        <a class="menu-item" href="/play">Play</a>
        <a class="menu-item" href="/wiki">Wiki</a>
    </nav>
    <div class="global-actions">
        <span id="sessionStateBadge" class="badge-retro">ONLINE</span>
        <button type="button" id="logout-link" class="btn btn-retro btn-danger btn-sm">Log out</button>
    </div>
</header>
<main>
    <p class="hint">Signed in as <span id="who">…</span></p>
    <p id="status" class="status"></p>
    <section class="panel">
        <h2>Characters</h2>
        <p id="cap-hint" class="hint"></p>
        <div id="char-list"></div>
    </section>
    <section class="panel">
        <h2>Create</h2>
        <form id="create-form">
            <label>Name
                <input id="char-name" type="text" maxlength="20" minlength="3" autocomplete="off" required>
            </label>
            <label>Vocation
                <select id="char-voc"></select>
            </label>
            <p class="hint">3–20 characters. Start with a letter. Digits allowed. Spaces only between words.</p>
            <button type="submit">Create</button>
        </form>
    </section>
</main>
<footer>Play fetches a one-shot token, then opens the world. The token is not placed in the URL.</footer>
<script src="/js/prefs.js"></script>
<script src="/js/api.js"></script>
<script src="/js/account.js"></script>
</body>
</html>
