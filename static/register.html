<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<title>Register · Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="editor-header-bar">
    <a class="brand" title="Engine" href="/">
        <i class="fa-solid fa-dragon"></i> Engine
    </a>
    <nav class="menu-items">
        <a class="menu-item" href="/">Home</a>
        <a class="menu-item" href="/account">Characters</a>
        <a class="menu-item" href="/play">Play</a>
        <a class="menu-item" href="/wiki">Wiki</a>
    </nav>
    <div class="global-actions">
        <a href="/login" class="btn btn-retro btn-secondary btn-sm">Login</a>
        <a href="/register" class="btn btn-retro btn-primary btn-sm active" aria-current="page">Register</a>
    </div>
</header>
<main>
    <section class="panel">
        <h2>Register</h2>
        <form id="register-form">
            <label>Email
                <input id="email" type="email" autocomplete="username" required>
            </label>
            <label>Password
                <input id="password" type="password" autocomplete="new-password" required minlength="10" maxlength="128">
            </label>
            <label>Confirm password
                <input id="password-confirm" type="password" autocomplete="new-password" required minlength="10" maxlength="128">
            </label>
            <p class="hint">Password 10–128 characters. Email is unique. Duplicate emails return a generic conflict.</p>
            <button type="submit">Create account</button>
            <p id="status" class="status"></p>
        </form>
    </section>
</main>
<footer>Session cookie is httpOnly. This page does not write a character file.</footer>
<script src="/js/prefs.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
